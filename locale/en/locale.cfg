gui-landfill-tip=Bridge water under the run with tile ghosts. The tile placed is whatever the terrain's own cover is: landfill on water, foundation on lava and oil, ice platform on Aquilo, platform foundation in space. Terrain with no cover stops the run either way. The water itself is never changed; the ghosts wait for construction robots like everything else.
