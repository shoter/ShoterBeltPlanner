[mod-name]
ShoterBeltPlanner=Shoter Belt Planner

[mod-description]
ShoterBeltPlanner=Plan and place belt runs with one tool: multiple lanes at once, around corners, forwards or backwards.

[item-name]
beltplanner-tool=Belt Planner

[item-description]
beltplanner-tool=Click where the belts start, move out to set how many lanes wide and click again, then click to run belts to a point. Click off to one side to turn a corner. Shift+right-drag ends the run with a row of splitters. Switch on "Clear my buildings" to build straight through your own machines, or "Blow up cliffs" to mark cliffs in the way for removal once cliff explosives are researched. Where quality is in play, Alt+mouse wheel or the tool window picks the quality the ghosts are placed at. Shift+B and Ctrl+Shift+B step through the belt tiers you have researched, R flips the direction, right-drag cancels.

[shortcut-name]
beltplanner-shortcut=Belt Planner

[controls]
beltplanner-get-tool=Belt Planner: take tool
beltplanner-flip=Belt Planner: flip belt direction
beltplanner-cycle-belt=Belt Planner: next belt tier
beltplanner-press=Belt Planner: internal (do not rebind)
beltplanner-ctrl-press=Belt Planner: internal (do not rebind)
beltplanner-select-press=Belt Planner: internal (do not rebind)
beltplanner-toggle-tracker=Belt Planner: toggle tracker diagnostics (debug)
beltplanner-cycle-quality-up=Belt Planner: next quality
beltplanner-cycle-quality-down=Belt Planner: previous quality
beltplanner-cycle-belt-back=Belt Planner: previous belt tier

[mod-setting-name]
beltplanner-max-tiles=Maximum tiles per click
beltplanner-use-landfill=Landfill over water
beltplanner-clear-cliffs=Blow up cliffs

[mod-setting-description]
beltplanner-max-tiles=A run is planned in one tick, so this caps how much work a single click can ask for. Runs above the limit are refused instead of executed.
beltplanner-use-landfill=Default for the "Landfill over water" switch in the tool window. The tile placed is whatever the terrain's own cover is: landfill on water, foundation on lava and oil, ice platform on Aquilo, platform foundation in space. Changing it here affects new players only; use the window to change it now.
beltplanner-clear-cliffs=Default for the "Blow up cliffs" switch in the tool window. Changing it here affects new players only; use the window to change it now. Cliffs can only be removed once cliff explosives are researched.

[tips-and-tricks-item-name]
beltplanner-tips=Belt Planner

[tips-and-tricks-item-description]
beltplanner-tips=Take the tool with __CONTROL__beltplanner-get-tool__ or from the shortcut bar.\n\n[font=default-semibold]Start a run[/font]\nClick where the belts should start. The marked area then follows your pointer as a line one tile deep; its length is how many lanes wide the run will be, and the short side is the direction it sets off in. Click again to accept it. Dragging a rectangle instead does both at once, but cannot show itself being made: Factorio stops tracking the pointer while a mouse button is held.\n\n[font=default-semibold]Extend it[/font]\nClick where you want the belts to reach. Every click carries on from where the last one ended. Pointing at any row the bundle already covers keeps it straight, so a wide bus carries on from wherever across its width you click. Click off to one side of it and the run heads out along its own axis and then turns once; several lanes turn at staggered points so the bundle stays parallel and the same width.\n\n[font=default-semibold]While planning[/font]\n__CONTROL__beltplanner-flip__ flips which way the belts face, so a run can be built from its destination back to its source.\n__CONTROL__beltplanner-cycle-belt__ steps through the belt tiers and __CONTROL__beltplanner-cycle-belt-back__ steps back. Tiers your force has not researched yet are greyed out in the tool window and skipped over, so you are never handed a ghost nobody can build.\nWhere quality is in play, __CONTROL__beltplanner-cycle-quality-up__ and __CONTROL__beltplanner-cycle-quality-down__ step through the qualities, the same gesture that changes the quality of a ghost in hand; the tool window offers the same choice. Without quality the row is not shown and the ghosts are normal, as they always were.\nTrees, rocks and plants in the way are always cleared. Your own buildings are only cleared when the tool window says so, and stop the run otherwise. The same goes for cliffs: switch on "Blow up cliffs" and they are marked for removal the way a deconstruction planner marks them, which needs cliff explosives researched. Water is bridged only when the tool window says so, with whatever the terrain's own cover is: landfill on water, foundation on lava, ice platform on Aquilo, platform foundation in space.\nThe label at the cursor and the tool window both say what the click will cost - belts, landfill, trees, rocks and plants to fell, cliffs to blow up, buildings of yours to remove - and how many items a second the bundle will carry.\nShift + right-drag ends the run with a row of splitters instead of belts.\nRight-drag cancels.\n\n[font=default-semibold]What it places[/font]\nGhosts, always. Nothing is built for real and no item is consumed, so one press of undo removes a whole run, felled trees and landfill included. Nothing is tunnelled under and nothing you built is removed unasked: anything in the way stops the run and says what it was, because choosing an underground length for you would be a guess.

