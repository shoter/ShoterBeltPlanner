[mod-name]
ShoterBeltPlanner=Shoter Belt Planner

[mod-description]
ShoterBeltPlanner=Plan and place belt runs with one tool: multiple lanes at once, built forwards or backwards, tunnelling under whatever is in the way.

[item-name]
beltplanner-tool=Belt Planner

[item-description]
beltplanner-tool=Drag a line 1 tile deep to set the start and the number of lanes, then click to run belts to that point. Click off to one side to turn a corner. Ctrl+click also clears your own buildings out of the way. Shift+B changes belt tier, R flips the direction, right-drag cancels.

[shortcut-name]
beltplanner-shortcut=Belt Planner

[controls]
beltplanner-get-tool=Belt Planner: take tool
beltplanner-flip=Belt Planner: flip belt direction
beltplanner-cycle-belt=Belt Planner: next belt tier
beltplanner-press=Belt Planner: internal (do not rebind)
beltplanner-ctrl-press=Belt Planner: internal (do not rebind)
beltplanner-toggle-tracker=Belt Planner: toggle tracker diagnostics (debug)

[mod-setting-name]
beltplanner-max-tiles=Maximum tiles per click
beltplanner-use-tunnels=Tunnel under obstacles
beltplanner-use-landfill=Landfill over water

[mod-setting-description]
beltplanner-max-tiles=A run is planned in one tick, so this caps how much work a single click can ask for. Runs above the limit are refused instead of executed.
beltplanner-use-tunnels=Default for the tunnelling switch in the tool window. Changing it here affects new players only; use the window to change it now.
beltplanner-use-landfill=Default for the landfill switch in the tool window. Changing it here affects new players only; use the window to change it now.

[beltplanner]
gui-title=Belt Planner
gui-belt=Belt
gui-tunnels=Tunnel under obstacles
gui-tunnels-tip=Bridge an obstacle with an underground pair spanning exactly that obstacle and no further. With this off, a blocked run is refused instead of guessed at.
gui-landfill=Landfill over water
gui-landfill-tip=Place landfill ghosts on water under the run. The water itself is never changed; the ghosts wait for construction robots like everything else.
gui-clear=Clear my buildings
gui-clear-tip=Mark your own buildings in the way for deconstruction. Trees and rocks are always cleared. Hold Ctrl while clicking to do this for one click without leaving the option on.
gui-status=Running __1__ lane(s). Click to extend, R to flip, right-drag to cancel.
gui-status-reversed=Running __1__ lane(s), reversed. Click to extend, R to flip.
gui-status-idle=Drag a line 1 tile deep to start.
drag-label=__1__ lane(s)
preview-label=__1__ lane(s) - __2__ tiles__3__
reversed-suffix= - reversed
belt-chosen=__1__
cancelled=Cancelled
tracker-on=Belt Planner: tracker diagnostics ON.
tracker-off=Belt Planner: tracker diagnostics OFF.
purge-help=Destroys every Belt Planner cursor probe in the world. Safe to run at any time.
purge-done=Belt Planner: removed __1__ cursor probe(s).
error-not-a-line=Drag a line 1 tile deep, not __1__x__2__
error-zero-length=Pick a tile away from the start
error-blocked=Blocked. Turn on tunnelling to go under it.
error-blocked-at-end=Blocked at the end of the run: no room for a tunnel entrance
error-tunnel-too-long=Obstacle is __1__ tiles; this belt only reaches __2__
error-corner-too-close=Not enough room to turn: go further out before turning
error-corner-too-shallow=Turn is too shallow for __1__ lane(s)
error-no-belts=No belts available
error-too-big=__1__ tiles is over the __2__ tile limit
error-nothing-placed=Nothing could be placed there
