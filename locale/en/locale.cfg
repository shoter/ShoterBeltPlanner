[mod-name]
ShoterBeltPlanner=Shoter Belt Planner

[mod-description]
ShoterBeltPlanner=Plan and place belt runs with one tool: multiple lanes at once, built forwards or backwards, tunnelling under whatever is in the way.

[item-name]
beltplanner-tool=Belt Planner

[item-description]
beltplanner-tool=Drag a line 1 tile deep to set the start and the number of lanes, then click to run belts to that point. Click off to one side to turn a corner. Ctrl+click also clears your own buildings out of the way. Shift+B changes belt tier, R flips the direction, right-drag cancels.

[shortcut-name]
beltplanner-shortcut=Belt Planner

[controls]
beltplanner-get-tool=Belt Planner: take tool
beltplanner-flip=Belt Planner: flip belt direction
beltplanner-cycle-belt=Belt Planner: next belt tier
beltplanner-press=Belt Planner: internal (do not rebind)
beltplanner-ctrl-press=Belt Planner: internal (do not rebind)
beltplanner-toggle-tracker=Belt Planner: toggle tracker diagnostics (debug)

[mod-setting-name]
beltplanner-max-tiles=Maximum tiles per click
beltplanner-use-tunnels=Tunnel under obstacles
beltplanner-use-landfill=Landfill over water

[mod-setting-description]
beltplanner-max-tiles=A run is planned in one tick, so this caps how much work a single click can ask for. Runs above the limit are refused instead of executed.
beltplanner-use-tunnels=Bridge obstacles with an underground pair spanning exactly the obstacle. With this off, a blocked run is refused instead.
beltplanner-use-landfill=Place landfill ghosts on water tiles under the run. Water is never modified directly; the ghosts wait for construction robots like everything else.

